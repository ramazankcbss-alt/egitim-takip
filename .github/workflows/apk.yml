name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.egitimtakip --project-name egitim_takip .

      - name: Android ayarları (minSdk, uygulama adı)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' "$f"
          done
          sed -i -E 's/android:label="[^"]*"/android:label="Eğitim Takip"/' android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle* || true

      # İmza anahtarı depoda şifreli durur (ci/imza.keystore.enc).
      # Şifresi GitHub'da Settings > Secrets and variables > Actions altında
      # EGITIM_KEYSTORE_PASSWORD adıyla kayıtlıdır. Her derleme aynı anahtarla
      # imzalanır, böylece yeni sürümler eskisinin üzerine kurulabilir.
      - name: İmza anahtarını hazırla
        env:
          KEYSTORE_PASSWORD: ${{ secrets.EGITIM_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::EGITIM_KEYSTORE_PASSWORD gizli ayarı eksik. Settings > Secrets and variables > Actions bölümünden ekleyin."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -in ci/imza.keystore.enc \
            -out "$RUNNER_TEMP/imza.keystore" -pass env:KEYSTORE_PASSWORD

      - name: Paketleri güncelle
        run: flutter pub upgrade --major-versions

      - name: Testler
        run: flutter test

      - name: APK derle
        run: |
          flutter build apk --release \
            --build-name=3.0.${{ github.run_number }} \
            --build-number=$((1000 + ${{ github.run_number }}))

      # APK, Gradle'ın ürettiği geçici anahtar yerine bizim anahtarla yeniden
      # imzalanır ve imza doğrulanır. Yanlış anahtar varsa yayınlanmaz.
      - name: APK'yı imzala ve doğrula
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/imza.keystore" \
            --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
            --out build/app/outputs/flutter-apk/egitim-takip.apk \
            build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/egitim-takip.apk | tee imza.txt
          grep -q "CN=Egitim Takip" imza.txt || { echo "::error::APK doğru anahtarla imzalanmadı"; exit 1; }
          rm -f "$RUNNER_TEMP/imza.keystore"

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Eğitim Takip - Sürüm 3.0.${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **egitim-takip.apk** dosyasına dokunun.
          files: build/app/outputs/flutter-apk/egitim-takip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
