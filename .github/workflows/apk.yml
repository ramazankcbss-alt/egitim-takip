name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.egitimtakip --project-name egitim_takip .

      - name: Android ayarları (minSdk 23, uygulama adı, imza anahtarı)
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 23/' "$f"
          done
          sed -i -E 's/android:label="[^"]*"/android:label="Eğitim Takip"/' android/app/src/main/AndroidManifest.xml
          # Her derlemede aynı imza kullanılsın ki güncellemeler eskisinin üzerine kurulabilsin.
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Paketleri güncelle
        run: flutter pub upgrade --major-versions

      - name: Testler
        run: flutter test

      - name: APK derle
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/egitim-takip.apk

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Eğitim Takip - Sürüm ${{ github.run_number }}
          body: |
            Telefona kurmak için aşağıdaki **egitim-takip.apk** dosyasına dokunun.
          files: build/app/outputs/flutter-apk/egitim-takip.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
